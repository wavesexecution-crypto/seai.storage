services:
  postgres:
    image: postgres:16
    container_name: seai-storage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seai_storage
      POSTGRES_PASSWORD: seai_storage_dev
      POSTGRES_DB: seai_storage
    ports:
      - "5434:5432"
    volumes:
      - seai-storage-pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: seai-storage-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - seai-storage-minio:/data

volumes:
  seai-storage-pgdata:
  seai-storage-minio:
